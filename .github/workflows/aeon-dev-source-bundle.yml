name: Aeon offline development source bundle
on:
  push:
    branches: [ghost-signal-engine]
    paths:
      - '.github/workflows/aeon-dev-source-bundle.yml'
      - 'frontend/public/js/engine/campaign-*.js'
      - 'frontend/public/campaign.html'
  workflow_dispatch:
jobs:
  source-archive:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package public source for offline game integration QA
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='node_modules' --exclude='.git' --exclude='character-output' \
            -czf /tmp/aeon-engine-sources.tar.gz frontend android docs .github
          sha256sum /tmp/aeon-engine-sources.tar.gz > /tmp/aeon-engine-sources.sha256
          ls -lh /tmp/aeon-engine-sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aeon-engine-offline-source
          path: |
            /tmp/aeon-engine-sources.tar.gz
            /tmp/aeon-engine-sources.sha256
          if-no-files-found: error
          retention-days: 7
