name: Aeon private-campaign entry contract (synthetic)
on:
  push:
    branches: [ghost-signal-engine]
    paths:
      - 'frontend/public/js/engine/campaign-*.js'
      - 'frontend/public/campaign.html'
      - 'frontend/public/engine-lab.html'
      - 'frontend/tests/browser-engine-lab-campaign.mjs'
      - 'frontend/tests/browser-campaign-opening.mjs'
      - 'frontend/tests/browser-campaign-combat.mjs'
      - '.github/workflows/campaign-opening-browser.yml'
  pull_request:
    branches: [ghost-signal-engine]
    paths:
      - 'frontend/public/js/engine/campaign-*.js'
      - 'frontend/public/campaign.html'
      - 'frontend/public/engine-lab.html'
      - 'frontend/tests/browser-engine-lab-campaign.mjs'
      - 'frontend/tests/browser-campaign-opening.mjs'
      - 'frontend/tests/browser-campaign-combat.mjs'
      - '.github/workflows/campaign-opening-browser.yml'
  workflow_dispatch:
concurrency:
  group: aeon-campaign-opening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --prefix frontend --no-save --no-audit --no-fund playwright@1.56.1
          cd frontend && npx playwright install --with-deps chromium
      - name: Serve existing Ghost Signal game
        run: |
          PORT=3000 HOST=127.0.0.1 node frontend/serve.js >/tmp/ghost-signal-campaign.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/campaign.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ghost-signal-campaign.log
          exit 1
      - name: Real browser starter, opening dialogue, saved Continue
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-campaign-opening.mjs
      - name: Real browser reviewed combat gate, interruption and durable victory
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-campaign-combat.mjs
      - name: Debug launcher only advertises owner-installed campaign
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-engine-lab-campaign.mjs
      - name: Upload useful diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeon-campaign-opening-browser-diagnostics
          path: |
            frontend/test-artifacts/campaign-opening-synthetic.png
            frontend/test-artifacts/campaign-opening-failure.png
            frontend/test-artifacts/campaign-opening-error.txt
            frontend/test-artifacts/campaign-battle-synthetic.png
            frontend/test-artifacts/campaign-battle-failure.png
            frontend/test-artifacts/campaign-battle-error.txt
          if-no-files-found: ignore
          retention-days: 7