name: Sprite Studio copy regression
on:
  push:
    branches: [sprite-studio-sleek-copy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:studio
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    needs: native-renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:studio:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprite-studio-browser-review
          path: |
            docs/sprite-studio-sleek/checks.json
            docs/sprite-studio-sleek/desktop-editor.png
            docs/sprite-studio-sleek/phone-landscape-editor.png
