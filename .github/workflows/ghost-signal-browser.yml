name: Ghost Signal Engine browser integration
on:
  push:
    branches: [ghost-signal-engine]
    paths:
      - 'frontend/**'
      - '.github/workflows/ghost-signal-browser.yml'
  pull_request:
    branches: [ghost-signal-engine]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          cd frontend
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Node engine unit tests
        run: node --test frontend/tests/*.test.mjs
      - name: Start static Ghost Signal server
        run: |
          PORT=3000 HOST=127.0.0.1 node frontend/serve.js > /tmp/ghost-signal-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ghost-signal-server.log
          exit 1
      - name: Narrative adapter — original UI, keyboard, rollback and reload
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-campaign-narrative.mjs

      - name: Browser smoke — field, UI, saves, original game, Sprite Studio
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-rpg-lab.mjs

      - name: Browser routes — real relay traversal and flee recovery
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-rpg-lab-routes.mjs

      - name: Browser equipment — chassis compatibility and live battle stats
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-rpg-lab-equipment.mjs

      - name: Browser recovery — asynchronous checkpoint and RPG journal rollback
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-rpg-lab-recovery.mjs

      - name: Browser tactics — charged sentry intent and guard response
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-rpg-lab-tactics.mjs

      - name: Side-view battle — animated stage, inputs and pixel screenshot
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-rpg-sideview.mjs

      - name: Upload side-view battle preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aeon-sideview-battle-preview
          path: frontend/test-artifacts/sideview-battle-preview.png
          if-no-files-found: error
          retention-days: 14

      - name: Aeon v5 — select starter, use 8-frame world and real side-view pipeline (synthetic CI art)
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-aeon-v5.mjs

      - name: Upload v5 opt-in integration preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aeon-v5-synthetic-integration-preview
          path: |
            frontend/test-artifacts/aeon-v5-starter-field.png
            frontend/test-artifacts/aeon-v5-sideview-battle.png
          if-no-files-found: error
          retention-days: 14

      - name: PRIVATE campaign preview — synthetic starter, opening dialogue and durable Continue
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-campaign-opening.mjs

      - name: Connected expedition — real Tiled map crossing, interactions, saves
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-connected-lab.mjs

      - name: Unified Aeon engine — picker, connected field, battle, save and continue
        if: ${{ !cancelled() }}
        run: GS_BASE_URL=http://127.0.0.1:3000 node frontend/tests/browser-aeon-unified.mjs

      - name: Upload unified engine acceptance previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aeon-unified-acceptance-preview
          path: |
            frontend/test-artifacts/aeon-unified-*-field.png
            frontend/test-artifacts/aeon-unified-sideview.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-signal-browser-failure
          path: frontend/test-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI result in persistent GitHub issue
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GHOST_RESULT: ${{ job.status }}
          GHOST_SHA: ${{ github.sha }}
          GHOST_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 2 --body "Ghost Signal Engine browser CI: **${GHOST_RESULT}** · source \`${GHOST_SHA}\` · [View test run](${GHOST_RUN_URL}). This is an automated Node/Chromium verification receipt, not physical Android or full gameplay acceptance."
