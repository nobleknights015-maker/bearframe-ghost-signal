name: Ghost Signal Engine regressions
on:
  push:
    branches: [ghost-signal-engine]
  pull_request:
    branches: [ghost-signal-engine]
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every shipped JavaScript module and test syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/public/js frontend/tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run original-interface and hybrid-engine regression tests
        run: node --test frontend/tests/*.test.mjs
