name: Ghost Signal Android debug APK
on:
  push:
    branches: [ghost-signal-engine]
    paths:
      - 'android/**'
      - 'frontend/public/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble development APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-signal-engine-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Record Android build result in engine evidence issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ job.status }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 2 --body "Ghost Signal Android debug APK CI: **${BUILD_RESULT}** · source \`${BUILD_SHA}\` · [Build run / artifacts](${BUILD_RUN_URL}). This is compile/package evidence only, NOT device install, Moto G performance or physical-controller acceptance."
